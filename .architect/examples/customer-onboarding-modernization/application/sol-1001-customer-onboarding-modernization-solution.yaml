  scope:
    business_outcomes:
      - Faster customer activation after onboarding approval
      - Visible and recoverable downstream activation flow
    in_scope_domains:
      - Customer
      - Policy Administration
    out_of_scope:
      - Pricing and underwriting redesign
      - Non-customer lifecycle orchestration

  architecture:
    context: Customer onboarding approval triggers a governed onboarding service that emits an activation event to Policy Administration using the integration event runtime.
    logical_components:
      - Customer Onboarding Portal
      - Customer Onboarding Service
      - Integration Event Runtime
      - Policy Administration
    integration_patterns:
      - event-driven synchronization
      - approval-triggered activation
    data_patterns:
      - activation profile as governed data handoff
      - correlation-id traceability

  quality_attributes:
    availability: 99.5%
    resilience: retry and replay support for activation events
    security: role-based access and encrypted transport
    observability: end-to-end correlation and failure alerts

  governance:
    approval_forum: Architecture Review Board
    review_cadence: milestone-based
    deviation_process: Formal design waiver required for side-channel activation paths.

  tags:
    - solution
    - onboarding
    - transition

  notes:
    assumptions:
      - Customer onboarding remains the authoritative initiation point for downstream activation.
    risks:
      - Dual operation of old and new activation patterns would complicate support and measurement.
