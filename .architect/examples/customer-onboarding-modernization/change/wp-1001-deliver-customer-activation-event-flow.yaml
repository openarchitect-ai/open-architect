  planning:
    start_date: 2026-07-15
    target_end_date: 2026-10-15
    delivery_method: agile
    funding_status: funded
    milestone: activation-event-go-live

  scope:
    objectives:
      - Implement the onboarding activation service
      - Publish the standard customer activation event
      - Enable Policy Administration downstream consumption
    in_scope:
      applications:
        - APP-1001
        - APP-1002
      application_services:
        - AS-1001
      interfaces:
        - IF-1001
      data_objects:
        - DO-1001
    out_of_scope:
      - Additional downstream consumer onboarding
      - Historical activation replay beyond cutover support

  deliverables:
    architecture_deliverables:
      - Updated solution design
      - Approved activation event contract
      - Cutover and support model
    implementation_deliverables:
      - Deployed onboarding activation service
      - Production-ready activation event feed
      - Operational traceability dashboard

  dependencies:
    predecessor_work_packages: []
    successor_work_packages: []
    blockers:
      - Downstream event contract sign-off
      - Production observability configuration approval

  acceptance_criteria:
    - Activation event feed passes integration testing with Policy Administration.
    - Correlation-id based activation traceability is visible in operations dashboards.
    - Manual fallback is documented and tested for failed event delivery.

  governance:
    decision_log_required: true
    reporting_cadence: fortnightly
    architecture_checkpoint: required-before-production

  tags:
    - work-package
    - onboarding
    - delivery

  notes:
    assumptions:
      - Delivery and operations teams share a common cutover readiness checklist.
    risks:
      - Support model gaps could delay go-live approval even if build completes on time.
