        - IF-1001
      data_objects:
        - DO-1001

  changes:
    introduced:
      - kind: application-service
        id: AS-1001
        change_type: introduce
        rationale: Introduce a governed activation service boundary.
      - kind: interface
        id: IF-1001
        change_type: introduce
        rationale: Introduce the standard customer activation event feed.
    modified:
      - kind: application
        id: APP-1001
        change_type: modify
        rationale: Extend onboarding portal to emit activation through the service.
      - kind: application
        id: APP-1002
        change_type: modify
        rationale: Enable downstream consumption of activation events.
      - kind: data-object
        id: DO-1001
        change_type: modify
        rationale: Finalize the governed activation profile for downstream use.
    retained: []
    retired: []

  dependencies:
    predecessor_transition_architectures: []
    dependent_work_packages:
      - WP-1001
    blocking_risks:
      - Downstream event adoption readiness must be confirmed before go-live.
      - Production observability controls must be in place before activation cutover.

  outcomes:
    business_outcomes:
      - Customer activation is triggered through the standard flow.
      - Operations can trace successful and failed downstream activation.
    architecture_outcomes:
      - A single activation service boundary is established.
      - The activation event feed becomes the governed downstream pattern.

  exit_criteria:
    - Customer activation event feed is live in production.
    - Policy Administration consumes the standard activation event for Wave 1 scope.
    - Operational dashboards expose correlation-id based activation traceability.

  governance:
    approval_forum: Architecture Review Board
    review_cadence: fortnightly
    exception_process: Formal architecture waiver required for bypassing the standard event feed.

  tags:
    - transition
    - onboarding
    - wave-1

  notes:
    assumptions:
      - Wave 1 can go live without redesigning all onboarding variants.
    risks:
      - Partial cutover could create dual operational behavior if not tightly controlled.
