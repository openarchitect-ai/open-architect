    - type: used-by-transition-architecture
      target_kind: transition-architecture
      target_id: TA-1001
      strength: supporting
      confidence: medium
    - type: constrained-by-requirement
      target_kind: requirement
      target_id: REQ-1001
      strength: supporting
      confidence: medium

  runtime:
    availability_tier: tier-1
    network_zone: private
    deployment_pattern: multi-zone
    support_window: 24x7

  constraints:
    residency:
      - Customer activation data must remain within approved EU hosting boundaries.
    security:
      - Production access requires privileged identity approval.
      - Secrets must be managed using approved platform controls.
    operational:
      - Changes require approved production release management.

  connectivity:
    ingress_patterns:
      - managed-api-gateway
      - approved-private-connectivity
    egress_patterns:
      - controlled-outbound-event-delivery
    restricted_patterns:
      - unmanaged-public-endpoints

  governance:
    change_control: production-change-board
    review_frequency: quarterly
    compliance_evidence_required: true

  tags:
    - environment
    - production
    - onboarding

  notes:
    assumptions:
      - The production environment will remain the first deployment target for the worked example.
    risks:
      - Regional environment drift could weaken traceability and deployment consistency.
