  metadata:
    source_of_truth:
      system: Open Architect Worked Example
      record_locator: ENV-1001
      owner: Enterprise Platforms
    last_reviewed: 2026-05-21
    review_owner: Enterprise Platforms
    confidence: high
    references:
      - type: diagram
        title: Transition Architecture View
        url: .architect/examples/customer-onboarding-modernization/views/transition-customer-onboarding-wave-1.md
    change_log:
      - date: 2026-05-21
        summary: Created worked example production environment for onboarding integration.
        author: Open Architect

  relationships:
    - type: hosts-solution
      target_kind: solution
      target_id: SOL-1001
      strength: supporting
      confidence: medium
    - type: hosts-application
      target_kind: application
      target_id: APP-1001
      strength: supporting
      confidence: medium
    - type: hosts-technology-component
      target_kind: technology-component
