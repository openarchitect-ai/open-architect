    - type: delivered-by-work-package
      target_kind: work-package
      target_id: WP-1001
      strength: supporting
      confidence: medium

  intent:
    statement: Customer activation must complete reliably and be fully traceable from onboarding approval to downstream activation outcome.
    rationale:
      - Operations must quickly identify and recover failed activations.
      - Business benefit depends on predictable downstream propagation.
    success_measure:
      - name: activation-success-rate
        target: 99.5%
      - name: activation-traceability
        target: 100%

  specification:
    fit_criteria:
      - Activation events must be published within 5 minutes of onboarding approval.
      - Each activation must expose a correlation identifier visible to support teams.
      - Failed downstream activation must be recoverable without re-entering customer data.
    constraints:
      - Use the approved integration runtime and enterprise event logging controls.
      - Do not expose unmanaged activation endpoints outside the governed service boundary.
    assumptions:
      - Downstream consumers can process activation events within the agreed SLA.

  verification:
    verification_method:
      - integration test
      - operational readiness review
      - observability evidence review
    acceptance_owner: Customer Operations
    target_verification_date: 2026-10-15

  governance:
    source_priority: authoritative
    waiver_process: Architecture waiver required for reduced traceability coverage.

  tags:
    - requirement
    - reliability
    - onboarding

  notes:
    assumptions:
      - Correlation identifiers can be passed across all in-scope components.
    risks:
      - Partial observability implementation would reduce support effectiveness.
