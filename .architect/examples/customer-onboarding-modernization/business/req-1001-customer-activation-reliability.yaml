  metadata:
    source_of_truth:
      system: Open Architect Worked Example
      record_locator: REQ-1001
      owner: Solution Architecture
    last_reviewed: 2026-05-21
    review_owner: Solution Architecture
    confidence: high
    references:
      - type: diagram
        title: Activation Sequence Diagram
        url: .architect/examples/customer-onboarding-modernization/views/sequence-customer-activation-sync.puml
    change_log:
      - date: 2026-05-21
        summary: Created worked example requirement for activation reliability and traceability.
        author: Open Architect

  relationships:
    - type: constrains-solution
      target_kind: solution
      target_id: SOL-1001
      strength: primary
      confidence: high
    - type: constrains-transition-architecture
