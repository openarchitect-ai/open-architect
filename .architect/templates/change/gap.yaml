spec:
  id: GAP-0001
  name: missing-canonical-customer-sync
  display_name: Missing Canonical Customer Synchronization
  aliases:
    - Customer Sync Gap
  summary: Gap describing the absence of a standardized canonical customer synchronization capability in the baseline estate.
  description: >
    Architecture gap capturing a missing, weak, or non-compliant capability,
    service, interface, data construct, or technology element that must be
    addressed during transition.

  classification:
    gap_type: integration
    architecture_state: transition # baseline | transition | target
    severity: high # low | medium | high | critical
    criticality: high

  status:
    lifecycle: active # identified | active | resolved | retired | archived
    remediation_status: planned # identified | planned | in-progress | blocked | complete
    urgency: high # low | medium | high | critical

  ownership:
    gap_owner: Solution Architecture
    remediation_owner: Integration Delivery Lead
    business_owner: Customer Operations

  metadata:
    source_of_truth:
      system: Architecture Gap Register
      record_locator: GAP-0001
      owner: Enterprise Architecture
    last_reviewed: 2026-05-20
    review_owner: Solution Architecture
    confidence: medium
    references:
      - type: confluence
        title: Missing Canonical Customer Synchronization
        url: https://confluence.example.com/display/EA/missing-canonical-customer-sync
      - type: assessment
        title: Current State Integration Assessment
        url: https://example.com/assessment/customer-sync-gap
    change_log:
      - date: 2026-05-20
        summary: Initial gap template created for the AI-native workspace.
        author: Enterprise Architecture

  relationships:
    - type: identified-in
      target_kind: transition-architecture
      target_id: TA-0001
      strength: primary
      confidence: high
    - type: addressed-by
      target_kind: work-package
      target_id: WP-0001
      strength: primary
      confidence: high
    - type: driven-by
      target_kind: initiative
      target_id: INI-0001
      strength: supporting
      confidence: medium
    - type: constrained-by
      target_kind: decision
      target_id: DEC-0001
      strength: supporting
      confidence: medium
