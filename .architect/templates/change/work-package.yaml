    last_reviewed: 2026-05-20
    review_owner: Integration Delivery Lead
    confidence: medium
    references:
      - type: confluence
        title: Implement Customer Sync Wave 1
        url: https://confluence.example.com/display/EA/implement-customer-sync-wave-1
      - type: backlog
        title: Delivery Backlog Epic
        url: https://example.com/backlog/customer-sync-wave-1
    change_log:
      - date: 2026-05-20
        summary: Initial work package template created for the AI-native workspace.
        author: Enterprise Architecture

  relationships:
    - type: realizes-transition-architecture
      target_kind: transition-architecture
      target_id: TA-0001
      strength: primary
      confidence: high
    - type: part-of-initiative
      target_kind: initiative
      target_id: INI-0001
      strength: primary
      confidence: high
    - type: constrained-by
      target_kind: decision
