    last_reviewed: 2026-05-20
    review_owner: Integration Platform Team
    confidence: high
    references:
      - type: confluence
        title: Apache Kafka Event Platform
        url: https://confluence.example.com/display/EA/kafka-event-platform
      - type: standard
