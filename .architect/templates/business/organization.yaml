template:
  kind: organization
  version: 1.1
  schema_version: 1.1
  description: Template for a single organization or team entry in the enterprise architecture metamodel.

spec:
  id: ORG-0001
  name: customer-operations
  display_name: Customer Operations
  aliases:
    - Customer Ops
  summary: Business organization responsible for customer onboarding, stewardship, and operational support.
  description: >
    Business organization responsible for managing customer onboarding,
    customer data stewardship, and operational customer support processes.

  classification:
