project:
  name: Open Architect # replace with the project or workspace name if needed
  architecture_scope: enterprise-and-solution # enterprise | solution | enterprise-and-solution
  architecture_mode: project-local # project-local
  primary_method: .architect/method/project-method.md # selected project method
  reference_methods:
    - .architect/method/references/adm.md
    - .architect/method/references/transition-architecture.md

compliance:
  # Tailor these to the jurisdictions, sectors, and obligations that matter.
  jurisdictions:
    - eu-eea
    - united-states
  industry_sectors:
    - cross-industry
  applicable_regulations:
    - gdpr
    - uk-gdpr
    - eu-ai-act
    - european-accessibility-act
    - nis2
    - dora
    - cyber-resilience-act
    - eu-data-act
    - eidas-digital-identity
    - mica
    - glba
    - fedramp
    - cmmc
    - cjis-security-policy
    - hipaa-security-rule
    - ftc-safeguards-rule
    - sec-cyber-disclosure-rules
    - pci-dss
    - ccpa-cpra
    - coppa
    - ferpa
    - lgpd
  control_frameworks:
    - privacy
    - cybersecurity
    - operational-resilience
    - payment-security
    - ai-governance
    - accessibility
  data_residency_requirements: []
  ai_regulated_use: false
  incident_reporting_requirements: true

roles:
  enabled:
    # Enable only the roles that are active for this project.
    - chief-architect
    - business-analyst
    - business-architect
    - enterprise-architect
    - solution-architect
    - data-architect
    - integration-architect
    - domain-architect
    - security-architect
    - technology-architect
    - architecture-governance-lead

templates:
  enabled:
    # Enable only the template kinds that are in scope for the project.
    - stakeholder
    - objective
    - business-capability
    - business-process
    - organization
    - architecture-vision
    - principle
    - application
    - application-service
    - interface
    - data-object
    - technology-component
    - technology-standard
    - environment
    - requirement
    - solution
    - initiative
    - roadmap
    - transition-architecture
    - work-package
    - gap
    - decision
    - compliance-assessment
    - risk

skills:
  # Enable the reusable skills that are active for this project.
  enabled:
    - architecture-coordinator
    - project-bootstrapper
    - stakeholder-objective-framer
    - baseline-discovery
    - requirement-normalizer
    - requirements-follow-up
    - solution-modeler
    - relationship-mapper
    - decision-recorder
    - transition-planner
    - architecture-review
    - architecture-documenter
    - diagram-author

flows:
  enabled:
    # Enable only the flows used by this project.
    - architecture-development
    - transition-architecture

conventions:
  # Project-wide controls that can later be validated automatically.
  id_prefix_mode: standard
  traceability_required: true
  compliance_reviews_required: true
  architecture_reviews_required: true
  human_review_required: true
  allow_agent_auto_approval: false
  default_agent_output_status: draft
  stop_on_decision_changes: true
  stop_on_governance_status_changes: true
  evidence_required_for_approval: true

governance:
  # Assign role-level ownership for architecture, requirements, and reviews.
  architecture_owner_role: chief-architect
  requirement_steward_role: business-analyst
  review_role: architecture-governance-lead
  coordinator_role: chief-architect
  coordinator_skill: architecture-coordinator
  coordinator_auto_route: true
  human_approval_roles:
    - chief-architect
    - architecture-governance-lead
  review_checkpoints:
    - project-bootstrap
    - requirement-baseline
    - solution-direction
    - decision-approval
    - governance-review
    - transition-plan

runtime:
  execution_mode: coordinator-led-multi-agent # single-agent-guided | coordinator-led-multi-agent | external-orchestrated
  coordinator_agent_profile: .architect/agents/chief-architect.md
  state_root: .architect/runtime
  task_artifact: .architect/agents/artifacts/agent-task.yaml
  handoff_artifact: .architect/agents/artifacts/agent-handoff.yaml
  allow_parallel_specialists: true
  require_validation_before_handoff: true
