# Workspace-level defaults for Open Architect.
#
# This file holds the defaults a workspace inherits across all projects.
# Real engagement configuration lives under
# workspace/<project-name>/project-config.yaml — cloned from the chosen
# playbook's project-config.yaml template, then tailored per engagement.
#
# Engagement-specific fields (compliance scope, roles enabled, templates
# enabled, skills enabled, review checkpoints) intentionally do NOT live
# here. They belong in each project's own config so the workspace itself
# doesn't pretend to be an active engagement.

project:
  name: Open Architect                  # workspace identifier (informational)
  architecture_scope: enterprise-and-solution   # enterprise | solution | enterprise-and-solution
  architecture_mode: project-local              # project-local
  operating_style: architect-assist             # architect-assist | coordinator-led | external-orchestrated
  primary_method: .architect/method/project-method.md
  reference_methods:
    - .architect/method/references/adm.md
    - .architect/method/references/transition-architecture.md

conventions:
  # Workspace-default agent behavior. Projects inherit these defaults via their
  # own project-config.yaml and override individual fields as the engagement
  # requires.
  id_prefix_mode: standard
  traceability_required: true
  compliance_reviews_required: true
  architecture_reviews_required: true
  human_review_required: true
  user_is_primary_driver: true
  default_work_mode: inventory                  # inventory | analysis | modeling | review | decision
  guided_mode_support: true
  guided_mode_depth: standard                   # concise | standard | detailed
  clarify_operating_context_first: true
  include_architect_tasks_in_all_modes: true
  maximize_followup_task_capture: true
  announce_active_role_and_skill: true
  response_display_style: architect-friendly    # architect-friendly | minimal
  response_display_enforcement: strict          # strict | preferred
  response_session_banner: table                # table | compact
  response_status_labels: true
  response_task_grouping: ask-confirm-request-decide  # ask-confirm-request-decide | flat
  response_bottom_line: true
  response_structured_choices: true             # use host structured-choice UI for 2-4 discrete options; see config/response-display.md
  architect_work_auto_capture: true
  architect_work_auto_update_mode: approval-before-write  # suggest-only | approval-before-write | auto-update
  architect_work_auto_update_scope: architect-work-only   # architect-work-only | broader
  artifact_creation_requires_explicit_request: true
  next_step_recommendations_only: true
  auto_progression: false
  ask_before_scope_changes: true
  ask_before_status_changes: true
  ask_before_owner_creation: true
  ask_user_on_blocking_open_questions: true
  allow_progress_on_non_blocking_open_questions: true
  allow_agent_auto_approval: false
  default_agent_output_status: draft
  stop_on_decision_changes: true
  stop_on_governance_status_changes: true
  evidence_required_for_approval: true

runtime:
  # Default execution mode for newly scaffolded projects. A project's
  # project-config.yaml overrides this when it intentionally opts into
  # coordinator-led or external-orchestrated execution.
  execution_mode: single-agent-guided           # single-agent-guided | coordinator-led-multi-agent | external-orchestrated
  state_root: .architect/runtime
