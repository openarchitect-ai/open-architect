project:
  name: Steady-State Governance Practice
  architecture_scope: enterprise
  architecture_mode: project-local
  operating_style: architect-assist
  playbook: steady-state-governance
  primary_method: .architect/method/project-method.md
  reference_methods: []

compliance:
  # Set if the practice is operating in a regulated context.
  jurisdictions: []
  industry_sectors: []
  applicable_regulations: []
  control_frameworks: []
  data_residency_requirements: []
  ai_regulated_use: false
  incident_reporting_requirements: false

roles:
  enabled:
    - chief-architect
    - architecture-governance-lead
    - enterprise-architect
    - business-analyst
    - solution-architect
    - data-architect
    - integration-architect
    - security-architect
    - technology-architect

templates:
  enabled:
    - stakeholder
    - objective
    - architecture-vision
    - principle
    - technology-standard
    - decision
    - risk
    - compliance-assessment

skills:
  enabled:
    - project-recap
    - architecture-coordinator
    - baseline-discovery
    - stakeholder-objective-framer
    - decision-recorder
    - risk-compliance-assessor
    - architecture-review
    - evidence-curator
    - artifact-maintainer
    - requirements-follow-up
    - review-pack-builder
    - communication-packager
    - gap-radar
    - architecture-documenter

conventions:
  traceability_required: true
  compliance_reviews_required: true
  architecture_reviews_required: true
  user_is_primary_driver: true
  default_work_mode: review
  guided_mode_support: true
  guided_mode_depth: standard
  clarify_operating_context_first: true
  include_architect_tasks_in_all_modes: true
  announce_active_role_and_skill: true
  response_display_style: architect-friendly
  response_display_enforcement: strict
  response_session_banner: table
  response_status_labels: true
  response_task_grouping: ask-confirm-request-decide
  response_bottom_line: true
  architect_work_auto_capture: true
  architect_work_auto_update_mode: approval-before-write
  architect_work_auto_update_scope: architect-work-only
  artifact_creation_requires_explicit_request: true
  next_step_recommendations_only: true
  auto_progression: false
  ask_before_owner_creation: true
  allow_agent_auto_approval: false
  default_agent_output_status: draft
  stop_on_governance_status_changes: true
  evidence_required_for_approval: true

governance:
  architecture_owner_role: chief-architect
  requirement_steward_role: business-analyst
  review_role: architecture-governance-lead
  coordinator_role: chief-architect
  coordinator_skill: architecture-coordinator
  coordinator_auto_route: false
  human_approval_roles:
    - chief-architect
    - architecture-governance-lead
  review_checkpoints:
    - decision-approval
    - governance-review
    - project-bootstrap

runtime:
  execution_mode: single-agent-guided
  coordinator_agent_profile: .architect/agents/chief-architect.md
  state_root: .architect/runtime
  task_artifact: .architect/agents/artifacts/agent-task.yaml
  handoff_artifact: .architect/agents/artifacts/agent-handoff.yaml
  allow_parallel_specialists: false
  require_validation_before_handoff: true
